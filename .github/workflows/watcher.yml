name: Website Watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Watcher Agent
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_watcher.py

      - name: Save Memory (Commit & Push)
        run: |
          git config user.name "Watcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory.json
          git commit -m "Update memory: Content changed" || exit 0
          git pull --rebase origin main
          git push

      - name: Send Discord Alert on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "🚨 **CRASH DETECTED:** The Watcher Bot encountered a critical error!", "embeds": [{"title": "View GitHub Logs", "description": "The automated run crashed. Click the title above to view the logs and fix the issue.", "color": 16711680, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: 🧹 Cleanup Old Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 10
