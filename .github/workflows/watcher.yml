name: Website Watcher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Watcher Agent
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TARGET_URL: "https://www.rebamovie.com/"
          TARGET_SELECTOR: "body"
        run: python agent_watcher.py

      - name: Save Memory (Commit & Push)
        run: |
          git config user.name "Watcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_run.txt
          git commit -m "Update memory: Content changed" || exit 0
          git push
